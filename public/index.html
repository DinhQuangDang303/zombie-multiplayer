<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Zombie Survival Multiplayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; background: #0f172a; overflow: hidden; }
    canvas { display: block; background: #1e293b; }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
  <div class="absolute top-4 left-4 text-white z-10 bg-slate-900/80 px-4 py-2 rounded border border-slate-700">
    <div class="text-sm font-bold text-amber-400">MULTIPLAYER CO-OP</div>
    <div class="text-xs text-slate-300">WASD: Di chuyển | Chuột trái: Bắn</div>
    <div id="player-count" class="text-xs text-emerald-400 mt-1">Đang kết nối...</div>
  </div>

  <canvas id="gameCanvas" width="1200" height="800" class="border border-slate-700 rounded-lg shadow-2xl"></canvas>

  <script>
    const socket = io();
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let myId = null;
    let localPlayer = { x: 600, y: 400, angle: 0, speed: 4 };
    let gameState = { players: {}, zombies: [], bullets: [] };
    const keys = {};

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    let mousePos = { x: 0, y: 0 };
    canvas.addEventListener('mousemove', e => {
      const rect = canvas.getBoundingClientRect();
      mousePos.x = e.clientX - rect.left;
      mousePos.y = e.clientY - rect.top;
    });

    canvas.addEventListener('mousedown', () => {
      socket.emit('shoot', {
        x: localPlayer.x,
        y: localPlayer.y,
        angle: localPlayer.angle,
        dmg: 45
      });
    });

    socket.on('connect', () => {
      myId = socket.id;
    });

    socket.on('stateUpdate', state => {
      gameState = state;
      const count = Object.keys(state.players).length;
      document.getElementById('player-count').innerText = `Người chơi online: ${count}`;
    });

    function update() {
      let moved = false;
      if (keys['w'] || keys['arrowup']) { localPlayer.y -= localPlayer.speed; moved = true; }
      if (keys['s'] || keys['arrowdown']) { localPlayer.y += localPlayer.speed; moved = true; }
      if (keys['a'] || keys['arrowleft']) { localPlayer.x -= localPlayer.speed; moved = true; }
      if (keys['d'] || keys['arrowright']) { localPlayer.x += localPlayer.speed; moved = true; }

      localPlayer.angle = Math.atan2(mousePos.y - localPlayer.y, mousePos.x - localPlayer.x);

      if (moved || true) {
        socket.emit('playerMove', {
          x: localPlayer.x,
          y: localPlayer.y,
          angle: localPlayer.angle
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Lưới mặt đất
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Vẽ đạn
      ctx.fillStyle = '#facc15';
      for (let b of gameState.bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      // Vẽ Zombie
      for (let z of gameState.zombies) {
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(z.x, z.y, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#15803d';
        ctx.stroke();

        // Thanh máu zombie
        ctx.fillStyle = '#ef4444';
        ctx.fillRect(z.x - 16, z.y - 24, 32 * (z.hp / z.maxHp), 4);
      }

      // Vẽ người chơi khác và chính mình
      for (let id in gameState.players) {
        const p = gameState.players[id];
        const isMe = (id === myId);

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);

        // Nòng súng
        ctx.fillStyle = '#94a3b8';
        ctx.fillRect(0, -3, 22, 6);

        // Thân người chơi
        ctx.fillStyle = isMe ? '#38bdf8' : '#f97316';
        ctx.beginPath();
        ctx.arc(0, 0, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Tên người chơi
        ctx.fillStyle = isMe ? '#38bdf8' : '#f97316';
        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(isMe ? 'Bạn' : p.name, p.x, p.y - 24);
      }

      update();
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
